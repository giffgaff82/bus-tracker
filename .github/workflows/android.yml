# Builds the Android app on every change to android-app/.
#  - The APK and pictures of every widget state are attached to each run (Actions tab → run → Artifacts).
#  - Pushing a version tag (e.g. v1.2) also makes a GitHub Release with the APK to download on a phone.
# Signing uses repository secrets so new versions install over the old one:
#   WHICHSTOP_KEYSTORE_BASE64, WHICHSTOP_KEYSTORE_PASSWORD, WHICHSTOP_KEY_ALIAS, WHICHSTOP_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (fine for checking, but it won't
# install over the app on your phone).
name: Android app

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create releases on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install Capacitor and sync
        run: |
          npm ci
          npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.WHICHSTOP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/whichstop.keystore"
            echo "WHICHSTOP_KEYSTORE=$RUNNER_TEMP/whichstop.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning title=No signing key::Secrets not set – this APK uses a debug key and won't install over the app on your phone."
          fi

      - name: Build APK and render the widget
        working-directory: android-app/android
        env:
          WHICHSTOP_KEYSTORE_PASSWORD: ${{ secrets.WHICHSTOP_KEYSTORE_PASSWORD }}
          WHICHSTOP_KEY_ALIAS: ${{ secrets.WHICHSTOP_KEY_ALIAS }}
          WHICHSTOP_KEY_PASSWORD: ${{ secrets.WHICHSTOP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease :app:testDebugUnitTest --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -m1 versionName android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          NAME="Which-stop-${GITHUB_REF_NAME#v}.apk"
          [ "$GITHUB_REF_TYPE" = tag ] || NAME="Which-stop-${VERSION}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$NAME"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/whichstop.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: widget-pictures
          path: android-app/android/app/build/widget-shots/

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
