<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Which stop?</title>
<style>

main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px;box-sizing:border-box}

<svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="7.5" y="13" width="5" height="9" rx="2.5"/><rect x="51.5" y="13" width="5" height="9" rx="2.5"/><rect x="14" y="47" width="9" height="10" rx="3"/><rect x="41" y="47" width="9" height="10" rx="3"/><rect x="11" y="5" width="42" height="46" rx="9"/></g><g fill="var(--bg)"><rect x="16" y="14.5" width="32" height="18" rx="3.5"/><circle cx="19.5" cy="40.5" r="3.4"/><circle cx="44.5" cy="40.5" r="3.4"/></g></svg>
<h1>No connection</h1>
<p>Which stop? needs the internet to check live bus times. Check your signal or Wi-Fi, then try again.</p>
<button type="button" onclick="location.href='https://iangifford.com/bus/'">Try again</button>
</main>
<script>addEventListener('online',()=>location.href='https://iangifford.com/bus/')</script>
</body></html>
